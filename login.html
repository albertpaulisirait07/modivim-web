<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MoDiViM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MoDiViM</h1>
        <nav>
            <a href="index.html">Kembali ke Beranda</a>
        </nav>
    </header>

    <main class="center-content">
        <div class="card">
            <!-- Bagian ini akan menampilkan logo kampus, ditempatkan di atas teks login -->
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="assets/logo_unimed.png" alt="Logo Universitas Negeri Medan" style="width: 120px; height: auto;">
            </div>
            
            <h2 style="text-align: center; margin-bottom: 25px; color: #d4af37; font-size: 1.8rem;">Masuk Mahasiswa</h2>
            
            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="nim" style="color: #ccc; font-weight: bold;">NIM (Nomor Induk Mahasiswa)</label>
                    <input type="text" id="nim" required placeholder="Masukkan NIM Anda" style="padding: 12px; font-size: 1rem;">
                </div>
                <div class="form-group">
                    <label for="password" style="color: #ccc; font-weight: bold;">Password</label>
                    <input type="password" id="password" required placeholder="Masukkan Password" style="padding: 12px; font-size: 1rem;">
                </div>
                <button type="submit" class="btn-gold" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 1.1rem;">Masuk ke Ruang Misi</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
